<h2 class="text-center mb-4">Student Details</h2>

<div class="container">
  <div class="row g-4">
    @for (student of students; track student.name) {
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">Student</div>

          <div class="card-body">
            <h5 class="card-title">
              {{ getName(student.name) }}
            </h5>

            <h6>Marks:</h6>
            <p class="card-text mb-2">
              {{ student.marks }}
            </p>

            <h6>Result:</h6>
            <p class="card-text mb-2">
              @if (getResult(student.marks) === 'Pass') {
                <span>Pass</span>
              } @else {
                <span>Fail</span>
              }
            </p>

            <h6>Grade:</h6>
            <p class="card-text">
              {{ getGrade(student.marks) }}
            </p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
