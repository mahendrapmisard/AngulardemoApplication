<h2 class="text-center mb-4">Student Details</h2>

<div class="container">
  <div class="row g-4">
    @for (student of students; track student.name) {
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">Student</div>

          <div class="card-body">
            <h5>
              {{ getName(student.name) }}
            </h5>

            <p class="card-text mb-2">
              <strong>Marks:</strong>
              {{ student.marks }}
            </p>

            <p class="card-text mb-2">
              <strong>Result:</strong>

              @if (getResult(student.marks) === 'Pass') {
                <span> Pass </span>
              } @else {
                <span> Fail </span>
              }
            </p>

            <p class="card-text">
              <strong>Grade:</strong>

              <span>
                {{ getGrade(student.marks) }}
              </span>
            </p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
